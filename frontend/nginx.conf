server {
    listen 8080;
    server_name _;
    access_log off; # Public watchlists do not need request-query logs.
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/json application/javascript text/css text/csv;
    gzip_min_length 1024;
    gzip_vary on;
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A real read-only Python API now owns the versioned namespace.
    location ^~ /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/comparison.csv {
        types { }
        default_type text/csv;
        add_header Content-Disposition 'attachment; filename="brca1-2025-01-2025-02.csv"';
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /api { return 404; }
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
