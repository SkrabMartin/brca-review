[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brca-review"
version = "0.0.1"
description = "Retrospective review of public ClinVar changes for BRCA1 and BRCA2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
storage = [
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
]

web = [
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.35,<1",
]
test = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]
